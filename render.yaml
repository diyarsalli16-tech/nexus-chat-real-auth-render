services:
  - type: web
    name: nexus-chat-real-auth-render
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-chat-db
          property: connectionString

databases:
  - name: nexus-chat-db
    plan: free
